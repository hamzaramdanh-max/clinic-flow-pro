{% extends 'accounts/base.html' %}
{% load i18n %}

{% block content %}
<!-- استدعاء المكتبة والثيم الأحمر للفواتير -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_red.css">

<style>
    .flatpickr-calendar, .numInput {
        font-family: Arial, Helvetica, sans-serif !important;
        direction: ltr !important;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6 mt-5">
        <div class="card shadow-lg border-danger border-0 rounded-4">
            <div class="card-header text-white fw-bold" style="background: linear-gradient(135deg, #dc3545, #a52834);">
                💰 {{ title|default:_("Create New Invoice") }}
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Select Patient" %}</label>
                        {{ form.patient }}
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Select Doctor" %}</label>
                        {{ form.doctor }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Amount" %}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light fw-bold text-primary">{{ clinic_settings.currency }}</span>
                            {{ form.amount }}
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Due Date" %}</label>
                        {{ form.due_date }}
                    </div>

                    <div class="mb-4 form-check form-switch mt-4">
                        {{ form.is_paid }}
                        <label class="form-check-label fw-bold ms-2 text-success" for="id_is_paid">{% trans "Mark as Paid" %}</label>
                    </div>

                    <div class="d-flex justify-content-between mt-5">
                        <a href="{% url 'accounts:invoices_list' %}" class="btn btn-light border px-4 shadow-sm">{% trans "Cancel" %}</a>
                        <button type="submit" class="btn btn-danger fw-bold px-4 shadow-sm">{% trans "Save Invoice" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        flatpickr("input[name='due_date']", { 
            enableTime: false,  
            dateFormat: "Y-m-d", 
            altInput: true,
            altFormat: "F j, Y", 
            disableMobile: "true",
            locale: "en",
            onReady: function(selectedDates, dateStr, instance) {
                const numberInputs = instance.calendarContainer.querySelectorAll('input[type="number"]');
                numberInputs.forEach(function(input) {
                    input.setAttribute('lang', 'en-US');
                    input.style.direction = 'ltr';
                });
            }
        });
    });
</script>
{% endblock %}
