{% extends 'accounts/base.html' %}
{% load i18n %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_green.css">

<style>
    .flatpickr-calendar, .numInput {
        font-family: Arial, Helvetica, sans-serif !important;
        direction: ltr !important;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6 mt-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header text-white fw-bold" style="background: linear-gradient(135deg, #198754, #146c43);">
                💊 {{ title|default:_("Add New Medicine") }}
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Medicine Name" %}</label>
                        {{ form.name }}
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Price" %}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light fw-bold text-success">{{ clinic_settings.currency }}</span>
                            {{ form.price }}
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Stock Quantity" %}</label>
                        {{ form.stock }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">{% trans "Expiry Date" %}</label>
                        {{ form.expiry_date }}
                    </div>

                    <div class="d-flex justify-content-between mt-5">
                        <a href="{% url 'accounts:medicines_list' %}" class="btn btn-light border px-4 shadow-sm">{% trans "Cancel" %}</a>
                        <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm">{% trans "Save Medicine" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        flatpickr("input[name='expiry_date']", { 
            enableTime: false,  
            dateFormat: "Y-m-d", 
            altInput: true,
            altFormat: "F j, Y", 
            minDate: "today", 
            disableMobile: "true",
            locale: "en",
            onReady: function(selectedDates, dateStr, instance) {
                const numberInputs = instance.calendarContainer.querySelectorAll('input[type="number"]');
                numberInputs.forEach(function(input) {
                    input.setAttribute('lang', 'en-US');
                    input.style.direction = 'ltr';
                });
            }
        });
    });
</script>
{% endblock %}
