{% extends 'accounts/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-header bg-primary text-white fw-bold">
                ➕ {{ title|default:_("Add New Patient") }}
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">{% trans "Patient Name" %}</label>
                        {{ form.name }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">{% trans "Phone Number" %}</label>
                        {{ form.phone }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">{% trans "Email (Optional)" %}</label>
                        {{ form.email }}
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'accounts:patients_list' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
                        <button type="submit" class="btn btn-success">{% trans "Save Patient" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
