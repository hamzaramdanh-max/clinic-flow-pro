{% extends 'accounts/base.html' %}
{% load i18n %}

{% block content %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">

<style>
    .flatpickr-calendar{
        direction:ltr !important;
        font-family:Arial,Helvetica,sans-serif !important;
    }

    .flatpickr-months,
    .flatpickr-weekdays,
    .flatpickr-days,
    .flatpickr-time{
        direction:ltr !important;
    }

    .flatpickr-calendar *,
    .flatpickr-time input,
    .numInput{
        font-family:Arial,Helvetica,sans-serif !important;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6 mt-5">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header text-white fw-bold"
                 style="background:linear-gradient(135deg,#0d6efd,#0b5ed7);">
                📅 {{ title|default:_("Book New Appointment") }}
            </div>

            <div class="card-body p-5">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">
                            {% trans "Select Patient" %}
                        </label>
                        {{ form.patient }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">
                            {% trans "Select Doctor" %}
                        </label>
                        {{ form.doctor }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">
                            {% trans "Date & Time" %}
                        </label>
                        {{ form.date_time }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">
                            {% trans "Status" %}
                        </label>
                        {{ form.status }}
                    </div>

                    <div class="d-flex justify-content-between mt-5">

                        <a href="{% url 'accounts:appointments_list' %}"
                           class="btn btn-light border shadow-sm px-4">
                            {% trans "Cancel" %}
                        </a>

                        <button type="submit"
                                class="btn btn-primary fw-bold shadow-sm px-4">
                            {% trans "Confirm Booking" %}
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/default.js"></script>

<script>

document.addEventListener("DOMContentLoaded",function(){

    flatpickr("#id_date_time",{

        locale: flatpickr.l10ns.default,

        enableTime:true,

        time_24hr:false,

        dateFormat:"Y-m-d H:i",

        altInput:true,

        altFormat:"F j, Y h:i K",

        minDate:"today",

        disableMobile:true,

        onReady:function(selectedDates,dateStr,instance){

            instance.calendarContainer.setAttribute("lang","en");

            instance.calendarContainer.style.direction="ltr";

            instance.calendarContainer.querySelectorAll("*").forEach(function(el){

                el.setAttribute("lang","en");

                el.style.direction="ltr";

            });

        }

    });

});

</script>

{% endblock %}
